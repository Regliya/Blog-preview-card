<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Blog preview card</title>

  <link rel="stylesheet" href="./styles/styles.css">
  <link rel="stylesheet" href="./styles/common.css">
</head>
<body>
    <div class="container">
        <main class="content">
            <img src="./assets/images/illustration-article.svg" alt="illustration-article">
          
            <div class="text-box">
                <div class="tag">
                    <p class="text-preset-3-bold">Learning</p>
                </div> 
                
                <time datetime="YYYY-MM-DD" class="text-preset-3">Published 21 Dec 2023</time>
                <article>
                    <a href="">
                        <h1 class="text-preset-1">HTML & CSS foundations</h1>
                    </a>
                    <p class="text-preset-2">These languages are the backbone of every website, defining structure, content, and presentation.</p>
                </article>
            </div>

            <div class="author">
                <img src="./assets/images/image-avatar.webp" alt="avatar">
                <p class="text-preset-3-bold">Greg Hooper</p>
            </div>
        </main>
    </div>
</body>
</html>
